[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bass-tracker"
version = "0.1.0"
description = "Bass transcription and practice support application skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=2.0,<3.0",
  "scipy>=1.14,<2.0",
  "librosa>=0.11,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "yt-dlp>=2026.8.19",
  "demucs>=4.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
bass-tracker-worker = "bass_tracker.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bass_tracker"]
